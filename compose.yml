version: "3.9"

services:
  db:
    image: postgres:16
    container_name: conductores_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: conductores
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5433:5432" # host:container (avoid colliding with other postgres on 5432)
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d conductores"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: conductores_app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
      - "50052:50052"

volumes:
  db_data:
